# ============================================================
# Extreme Crafting Table - Mod Properties
# ============================================================
mod_id=extremecraftingtable
mod_name=Extreme Crafting Table
mod_version=1.0.0-beta12

# NeoForge + Minecraft version
neo_version=21.1.240
minecraft_version=1.21.1
# Upper bound of the Minecraft versionRange in mods.toml. Bump together with
# minecraft_version. Current target is 1.21.1; next major is 1.22.
minecraft_version_next=1.22.0
# JEI version for MC 1.21.1. The matching JEI 1.21.1-neoforge jar is wired
# in build.gradle. Update both together when bumping MC.
jei_version=19.21.0.247
# Resource-pack format that matches minecraft_version. Bump together with
# minecraft_version. 1.21.0-1.21.1 = 48, 1.21.2-1.21.3 = 57, 1.21.4 = 61, 1.21.5 = 64,
# 1.21.6 = 71, 1.21.7 = 72, 1.21.8 = 73. processResources expands this into
# pack.mcmeta at build time.
pack_format=48

# Java settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false