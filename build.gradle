plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neo_version
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client { client() }
        server { server() }
    }
}

group = 'com.extremecraftingtable'
version = project.mod_version
base { archivesName = 'extremecraftingtable' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // JEI is published on CurseMaven / Modrinth maven proxies. Using the
    // official `mezz.jei` artifact via mavenCentral plus the BlameJared
    // maven for the few 1.21.1-neoforge builds that haven't synced.
    maven { url = "https://maven.blamejared.com" }
}

dependencies {
    compileOnly("net.neoforged:neoforge:${neo_version}:universal")
    // JEI integration: compileOnly so our plugin class can reference IModPlugin
    // and friends, runtimeOnly so the JEI jar is shipped with the dev / gameTest
    // runtimes for users who have JEI installed. The plugin is a separate
    // @JeiPlugin-annotated class so the project still loads when JEI is absent.
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
}

// Add the compiled Minecraft + NeoForge jar (Mojang-mapped classes) to the compile classpath.
// The moddev plugin writes it to build/moddev/artifacts/neoforge-${neo_version}.jar.
// This replaces a guess at a neoformruntime hash ('neoformHash' was never defined,
// so the old path resolved to compiledWithNeoForge_unknown_output.jar and the
// Minecraft classes were silently left off the classpath).
def neoformOutput = file("build/moddev/artifacts/neoforge-${neo_version}.jar")
if (neoformOutput.exists()) {
    sourceSets.main.compileClasspath += files(neoformOutput)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Expand version tokens in META-INF/neoforge.mods.toml and pack.mcmeta at build
// time. The moddev plugin does NOT substitute placeholders automatically —
// without this, the jar's [[mods]] version field stays as the literal
// "${version}" string, which NeoForge's ModInfo rejects during pre-load
// ("Illegal version number specified") and the game refuses to load the mod.
//
// Same caveat applies to ${minecraft_version} / ${minecraft_version_next} in
// mods.toml dependency blocks and ${pack_format} in pack.mcmeta. All three
// are sourced from gradle.properties so a version bump only needs to edit
// one file.
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'minecraft_version_next', project.minecraft_version_next
    inputs.property 'pack_format', project.pack_format
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version,
               minecraft_version: project.minecraft_version,
               minecraft_version_next: project.minecraft_version_next
    }
    filesMatching('pack.mcmeta') {
        expand pack_format: project.pack_format
    }
}
tasks.named('build') {
    dependsOn 'classes'
    dependsOn 'jar'
    dependsOn 'writeCompileCp'
}

// Custom naming: <modid>-<version>-<Loader>-<MC版本>.jar
tasks.named('jar', Jar) {
    archiveFileName = "${base.archivesName.get()}-${project.version}-neoforge-${project.minecraft_version}.jar"
    // SimTest is a developer-only regression harness — never ship it to users.
    // Exclude the package itself and any empty directory entries it would
    // otherwise leave behind in the jar's table of contents.
    exclude '**/devtools/simtest/**'
    exclude '**/devtools/simtest*'
    exclude 'com/extremecraftingtable/devtools/**'
}
tasks.named('sourcesJar', Jar) {
    archiveFileName = "${base.archivesName.get()}-${project.version}-neoforge-${project.minecraft_version}-sources.jar"
    // Same exclusion as the binary jar — sources for simtest are only useful
    // to developers building the project from source. Also drop the empty
    // parent directory entry the source set otherwise writes.
    exclude '**/devtools/simtest/**'
    exclude 'com/extremecraftingtable/devtools/**'
}

// Write the full compile classpath to build/compile-cp.txt for the manual-compile
// workflow.  The nfrt_artifact_manifest.properties generated by
// createMinecraftArtifacts only includes jars used during the artifact-creation
// process, which may omit third-party libraries (gson, guava, log4j, slf4j,
// night-config, fastutil, joml, lwjgl, …) that are present on the compile
// classpath as transitive dependencies of neoforge:universal.  Writing the
// actual compileClasspath here ensures manual javac invocations resolve all
// type signatures referenced by user classes (e.g. Gson in
// WorkbenchRecipeSerializer).
tasks.register('writeCompileCp') {
    dependsOn 'classes'
    doLast {
        def entries = new LinkedHashSet(sourceSets.main.compileClasspath.files)
        // Safeguard for clean builds: at configuration time the artifact jar does
        // not exist yet, so the block above could not add it to compileClasspath.
        // By now (depends on classes, which implies createMinecraftArtifacts) it
        // exists, so add it explicitly unless it is already present.
        if (neoformOutput.exists()) {
            entries.add(neoformOutput)
        }
        file("build/compile-cp.txt").text = entries.join(';')
    }
}

// SimTest harness — the WorkbenchRecipe algorithm-side regression tests
// are placed under `com.extremecraftingtable.devtools.simtest` on the main
// source set so that the shipped mod jar's `jar` task can exclude them.
// They are NOT run by a standalone Gradle task: the chain
//     Bootstrap.bootStrap → Blocks.<clinit> → FeatureFlags → LoadingModList
// requires the ModLauncher class loader, which is only present inside a
// real NeoForge run. The tests are designed to be invoked from a GameTest
// in `src/gameTest/java/com/extremecraftingtable/devtools/simtest/SimTestGameTest.java`
// (registered via the NeoForge GameTest registry), so `gradle gameTest`
// exercises them inside the full mod runtime.
//
// If you need a developer-time sanity check without booting Minecraft,
// just run the `compileJava` task and look for the build errors — those
// surface the same API mistakes a runtime failure would.